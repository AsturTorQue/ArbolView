[package]
name = "arbolview"
version = "0.3.5"
edition = "2021"
description = "ÁrbolView: see which folders fill your disks (Linux, Windows, macOS)"
authors = ["AsturTorQue"]
license = "MIT"
repository = "https://github.com/AsturTorQue/ArbolView"
readme = "README.md"
keywords = ["disk", "usage", "treemap", "gui", "cleanup"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "arbolview"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
trash = "5"

[target.'cfg(target_os = "macos")'.dependencies]
egui-winit = { version = "0.31", default-features = false }
# macOS hands out names as letter + combining accent (NFD); the UI font draws
# that accent as a box, so names are joined into single letters (NFC) for display
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
# Windows draws with Direct3D 12 through wgpu (OpenGL drivers are often missing
# there); OpenGL stays as the fallback.
eframe = { version = "0.31", features = ["wgpu"] }
# the version egui-wgpu 0.31 uses; turns on the Direct3D 12 backend (Vulkan alone isn't everywhere)
wgpu = { version = "24", default-features = false, features = ["dx12", "wgsl"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1
