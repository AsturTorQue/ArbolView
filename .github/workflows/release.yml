# Builds ÁrbolView on GitHub's machines and, for a tag such as v0.3.2,
# publishes the files as a release:
#   Linux    x86_64 and ARM64 (aarch64) AppImages
#   Windows  x64 and ARM64 zips with the .exe
#   macOS    one universal .dmg (Apple Silicon and Intel)
# Run it by hand from the Actions tab to just download the files as artifacts.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - run: ARCH=${{ matrix.arch }} sh packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux-${{ matrix.arch }}, path: dist/*.AppImage, if-no-files-found: error }

  windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: ${{ matrix.arch }} }
      - run: powershell -ExecutionPolicy Bypass -File packaging/build-windows.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with: { name: windows-${{ matrix.arch }}, path: dist/*.zip, if-no-files-found: error }

  macos:
    # always the current Apple Silicon image (fixed versions get retired)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
      - run: sh packaging/build-macos.sh
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/*.dmg, if-no-files-found: error }

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            **Descargas / Downloads**

            | Sistema | Archivo |
            |---|---|
            | Linux (Intel/AMD) | `ArbolView-*-x86_64.AppImage` |
            | Linux (ARM: Raspberry Pi 4/5, Ampere…) | `ArbolView-*-aarch64.AppImage` |
            | Windows (Intel/AMD) | `ArbolView-*-windows-x64.zip` |
            | Windows (ARM: Snapdragon, Surface…) | `ArbolView-*-windows-arm64.zip` |
            | macOS (Apple Silicon e Intel) | `ArbolView-*-macOS.dmg` |

            Linux: `chmod +x` y abrir · Windows: descomprimir y abrir `ArbolView.exe` · macOS: la primera vez, clic derecho ▸ Abrir.
